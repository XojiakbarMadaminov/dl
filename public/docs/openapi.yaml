openapi: 3.0.3
info:
  title: 'Dialog Platform API'
  description: 'Dialog survey platform API specification for frontend integration.'
  version: 1.0.0
servers:
  -
    url: 'http://dl.test'
tags:
  -
    name: Authentication
    description: "\nEndpoints for user registration, authentication, session tokens, and current user identity."
  -
    name: Business
    description: ''
  -
    name: Respondent
    description: "\nCore respondent participation flow: starting or resuming surveys, saving page answers, and completing surveys."
  -
    name: Admin
    description: ''
  -
    name: General
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Pass Authorization: Bearer <plainTextToken> using the token returned by /api/v1/auth/login or /api/v1/auth/register. Cookie-only SPA authentication is not implemented.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register User'
      operationId: registerUser
      description: 'Create only a user account with email and password. To create an organization, use the authenticated POST /api/v1/business/organizations endpoint with name and inn after registration.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 2
                    name: 'Dilshod Karimov'
                    email: owner@dialog.uz
                    locale: uz
                    platform_role: user
                    status: active
                    created_at: '2026-10-17T12:00:00.000000Z'
                  token: 1|qXyZ...plainTextToken
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Dilshod Karimov'
                      email:
                        type: string
                        example: owner@dialog.uz
                      locale:
                        type: string
                        example: uz
                      platform_role:
                        type: string
                        example: user
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
                  token:
                    type: string
                    example: 1|qXyZ...plainTextToken
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_ERROR
                    message: 'The email has already been taken.'
                    fields:
                      email:
                        - 'The email has already been taken.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                        example: 'The email has already been taken.'
                      fields:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email has already been taken.'
                            items:
                              type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Full name of the registrant. Must not be greater than 255 characters.'
                  example: 'Dilshod Karimov'
                email:
                  type: string
                  description: 'Unique email address for account login. Must be a valid email address. Must not be greater than 255 characters.'
                  example: owner@dialog.uz
                password:
                  type: string
                  description: 'Account password (minimum 8 characters). Must be at least 8 characters.'
                  example: Secret123!
                password_confirmation:
                  type: string
                  description: 'Optional password confirmation; must match the password when supplied. The value and <code>password</code> must match.'
                  example: Secret123!
                locale:
                  type: string
                  description: 'Preferred interface language (uz, ru, en). Default is uz.'
                  example: uz
                  enum:
                    - uz
                    - ru
                    - en
                  nullable: true
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login User'
      operationId: loginUser
      description: 'Authenticate with email and password to receive a Sanctum bearer token and user profile.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 2
                    name: 'Dilshod Karimov'
                    email: owner@dialog.uz
                    locale: uz
                    platform_role: user
                    status: active
                    created_at: '2026-10-17T12:00:00.000000Z'
                  token: 2|AbCd...plainTextToken
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Dilshod Karimov'
                      email:
                        type: string
                        example: owner@dialog.uz
                      locale:
                        type: string
                        example: uz
                      platform_role:
                        type: string
                        example: user
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
                  token:
                    type: string
                    example: 2|AbCd...plainTextToken
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVALID_CREDENTIALS
                    message: 'Invalid email or password.'
                    fields: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_CREDENTIALS
                      message:
                        type: string
                        example: 'Invalid email or password.'
                      fields:
                        type: object
                        properties: {}
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: ACCOUNT_INACTIVE
                    message: 'Your account is not active.'
                    fields: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: ACCOUNT_INACTIVE
                      message:
                        type: string
                        example: 'Your account is not active.'
                      fields:
                        type: object
                        properties: {}
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Registered user email address. Must be a valid email address. Must not be greater than 255 characters.'
                  example: owner@dialog.uz
                password:
                  type: string
                  description: 'User account password.'
                  example: Secret123!
                device_name:
                  type: string
                  description: 'Optional access-token device name. Defaults to web. Must not be greater than 255 characters.'
                  example: Android
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Current User Profile'
      operationId: currentUserProfile
      description: "Retrieve the currently authenticated user's profile, platform role, and organizations with their membership roles. Organizations are ordered by most recent membership first; users without memberships receive an empty array."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 2
                    name: 'Dilshod Karimov'
                    email: owner@dialog.uz
                    locale: uz
                    platform_role: user
                    status: active
                    created_at: '2026-10-17T12:00:00.000000Z'
                  organizations:
                    -
                      id: 1
                      name: 'Dialog Analytics Group'
                      inn: '123456789'
                      current_user_role: owner
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Dilshod Karimov'
                      email:
                        type: string
                        example: owner@dialog.uz
                      locale:
                        type: string
                        example: uz
                      platform_role:
                        type: string
                        example: user
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
                  organizations:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Dialog Analytics Group'
                        inn: '123456789'
                        current_user_role: owner
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Dialog Analytics Group'
                        inn:
                          type: string
                          example: '123456789'
                          description: 'Organization INN; null for legacy organizations until completed by an owner/manager.'
                          nullable: true
                        current_user_role:
                          type: string
                          example: owner
                      required:
                        - inn
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Unauthenticated.
                    fields: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
                        example: Unauthenticated.
                      fields:
                        type: object
                        properties: {}
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revoke the current access token. For SPA cookie sessions, invalidates the web session.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully.'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully.'
      tags:
        - Authentication
  /api/v1/business/organizations:
    get:
      summary: 'List Organizations'
      operationId: listOrganizations
      description: 'List all organizations that the authenticated user belongs to.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Dialog Analytics Group'
                      inn: '123456789'
                      status: active
                      created_by: 2
                      current_user_role: owner
                      created_at: '2026-10-17T12:00:00.000000Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Dialog Analytics Group'
                        inn: '123456789'
                        status: active
                        created_by: 2
                        current_user_role: owner
                        created_at: '2026-10-17T12:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Dialog Analytics Group'
                        inn:
                          type: string
                          example: '123456789'
                          description: 'Organization INN; null for legacy organizations until completed by an owner/manager.'
                          nullable: true
                        status:
                          type: string
                          example: active
                        created_by:
                          type: integer
                          example: 2
                        current_user_role:
                          type: string
                          example: owner
                        created_at:
                          type: string
                          example: '2026-10-17T12:00:00.000000Z'
                      required:
                        - inn
      tags:
        - Business
    post:
      summary: 'Create Organization'
      operationId: createOrganization
      description: 'Create a new organization with a name and unique INN after user registration. The authenticated user automatically becomes the OWNER.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  organization:
                    id: 1
                    name: 'Dialog Analytics Group'
                    inn: '123456789'
                    status: active
                    created_by: 2
                    current_user_role: owner
                    created_at: '2026-10-17T12:00:00.000000Z'
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Dialog Analytics Group'
                      inn:
                        type: string
                        example: '123456789'
                      status:
                        type: string
                        example: active
                      created_by:
                        type: integer
                        example: 2
                      current_user_role:
                        type: string
                        example: owner
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_ERROR
                    message: 'The name field is required.'
                    fields:
                      name:
                        - 'The name field is required.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                        example: 'The name field is required.'
                      fields:
                        type: object
                        properties:
                          name:
                            type: array
                            example:
                              - 'The name field is required.'
                            items:
                              type: string
      tags:
        - Business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The legal or display name of the business organization. Must not be greater than 255 characters.'
                  example: 'Dialog Analytics Group'
                inn:
                  type: string
                  description: 'Unique organization INN, sent as a string (maximum 255 characters). Must not be greater than 255 characters.'
                  example: '123456789'
              required:
                - name
                - inn
  '/api/v1/business/organizations/{organization_id}':
    get:
      summary: 'Get Organization'
      operationId: getOrganization
      description: 'Retrieve details of a specific organization. Requires membership in the organization or platform admin role.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  organization:
                    id: 1
                    name: 'Dialog Analytics Group'
                    inn: '123456789'
                    status: active
                    created_by: 2
                    current_user_role: owner
                    created_at: '2026-10-17T12:00:00.000000Z'
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Dialog Analytics Group'
                      inn:
                        type: string
                        example: '123456789'
                        description: 'Organization INN; null for legacy organizations until completed by an owner/manager.'
                        nullable: true
                      status:
                        type: string
                        example: active
                      created_by:
                        type: integer
                        example: 2
                      current_user_role:
                        type: string
                        example: owner
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
                    required:
                      - inn
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: FORBIDDEN
                    message: 'This action is unauthorized.'
                    fields: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: FORBIDDEN
                      message:
                        type: string
                        example: 'This action is unauthorized.'
                      fields:
                        type: object
                        properties: {}
      tags:
        - Business
    patch:
      summary: 'Update Organization'
      operationId: updateOrganization
      description: 'Update organization details. Requires OWNER or MANAGER role in the organization.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  organization:
                    id: 1
                    name: 'Dialog Analytics Worldwide'
                    inn: '123456789'
                    status: active
                    created_by: 2
                    current_user_role: owner
                    created_at: '2026-10-17T12:00:00.000000Z'
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Dialog Analytics Worldwide'
                      inn:
                        type: string
                        example: '123456789'
                        description: 'Organization INN; null for legacy organizations until completed by an owner/manager.'
                        nullable: true
                      status:
                        type: string
                        example: active
                      created_by:
                        type: integer
                        example: 2
                      current_user_role:
                        type: string
                        example: owner
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
                    required:
                      - inn
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: FORBIDDEN
                    message: 'This action is unauthorized.'
                    fields: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: FORBIDDEN
                      message:
                        type: string
                        example: 'This action is unauthorized.'
                      fields:
                        type: object
                        properties: {}
      tags:
        - Business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Updated display name for the organization. Must not be greater than 255 characters.'
                  example: 'Dialog Analytics Worldwide'
                inn:
                  type: string
                  description: 'Optional replacement INN. Must be a non-empty string unique to this organization (maximum 255 characters). Must not be greater than 255 characters.'
                  example: '123456789'
              required:
                - name
    parameters:
      -
        in: path
        name: organization_id
        description: 'The ID of the organization.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: organization
        description: 'The ID of the organization.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/business/organizations/{organization_id}/surveys':
    get:
      summary: 'List Surveys'
      operationId: listSurveys
      description: 'List all surveys belonging to the given organization. Returns paginated list of surveys.'
      parameters:
        -
          in: query
          name: page
          description: 'Page number for pagination.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number for pagination.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      organization_id: 1
                      status: draft
                      default_locale: uz
                      locales:
                        - uz
                        - ru
                        - en
                      title:
                        uz: 'Mijozlar qoniqishi so‘rovi'
                        ru: 'Опрос удовлетворенности клиентов'
                        en: 'Customer Satisfaction Survey'
                      description: null
                      welcome_message: null
                      thank_you_message: null
                      internal_note: 'Q4 Survey'
                      published_at: null
                      closed_at: null
                      archived_at: null
                      created_at: '2026-10-17T12:00:00.000000Z'
                  links:
                    first: 'http://localhost:8000/api/v1/business/organizations/1/surveys?page=1'
                    last: 'http://localhost:8000/api/v1/business/organizations/1/surveys?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    per_page: 20
                    to: 1
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        organization_id: 1
                        status: draft
                        default_locale: uz
                        locales:
                          - uz
                          - ru
                          - en
                        title:
                          uz: 'Mijozlar qoniqishi so‘rovi'
                          ru: 'Опрос удовлетворенности клиентов'
                          en: 'Customer Satisfaction Survey'
                        description: null
                        welcome_message: null
                        thank_you_message: null
                        internal_note: 'Q4 Survey'
                        published_at: null
                        closed_at: null
                        archived_at: null
                        created_at: '2026-10-17T12:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        organization_id:
                          type: integer
                          example: 1
                        status:
                          type: string
                          example: draft
                        default_locale:
                          type: string
                          example: uz
                        locales:
                          type: array
                          example:
                            - uz
                            - ru
                            - en
                          items:
                            type: string
                        title:
                          type: object
                          properties:
                            uz:
                              type: string
                              example: 'Mijozlar qoniqishi so‘rovi'
                            ru:
                              type: string
                              example: 'Опрос удовлетворенности клиентов'
                            en:
                              type: string
                              example: 'Customer Satisfaction Survey'
                        description:
                          type: string
                          example: null
                          nullable: true
                        welcome_message:
                          type: string
                          example: null
                          nullable: true
                        thank_you_message:
                          type: string
                          example: null
                          nullable: true
                        internal_note:
                          type: string
                          example: 'Q4 Survey'
                        published_at:
                          type: string
                          example: null
                          nullable: true
                        closed_at:
                          type: string
                          example: null
                          nullable: true
                        archived_at:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-10-17T12:00:00.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/v1/business/organizations/1/surveys?page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/v1/business/organizations/1/surveys?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      to:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
      tags:
        - Business
    post:
      summary: 'Create Draft Survey'
      operationId: createDraftSurvey
      description: 'Create a new draft survey within an organization. Selected locales must be a subset of [uz, ru, en], and default_locale must belong to selected locales.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  survey:
                    id: 1
                    organization_id: 1
                    status: draft
                    default_locale: uz
                    locales:
                      - uz
                      - ru
                      - en
                    title:
                      uz: 'Mijozlar qoniqishi so‘rovi'
                      ru: 'Опрос удовлетворенности клиентов'
                      en: 'Customer Satisfaction Survey'
                    description: null
                    welcome_message: null
                    thank_you_message: null
                    internal_note: 'Q4 Survey'
                    published_at: null
                    closed_at: null
                    archived_at: null
                    created_at: '2026-10-17T12:00:00.000000Z'
                properties:
                  survey:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      organization_id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: draft
                      default_locale:
                        type: string
                        example: uz
                      locales:
                        type: array
                        example:
                          - uz
                          - ru
                          - en
                        items:
                          type: string
                      title:
                        type: object
                        properties:
                          uz:
                            type: string
                            example: 'Mijozlar qoniqishi so‘rovi'
                          ru:
                            type: string
                            example: 'Опрос удовлетворенности клиентов'
                          en:
                            type: string
                            example: 'Customer Satisfaction Survey'
                      description:
                        type: string
                        example: null
                        nullable: true
                      welcome_message:
                        type: string
                        example: null
                        nullable: true
                      thank_you_message:
                        type: string
                        example: null
                        nullable: true
                      internal_note:
                        type: string
                        example: 'Q4 Survey'
                      published_at:
                        type: string
                        example: null
                        nullable: true
                      closed_at:
                        type: string
                        example: null
                        nullable: true
                      archived_at:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-10-17T12:00:00.000000Z'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_ERROR
                    message: 'The title.uz field is required.'
                    fields:
                      title.uz:
                        - 'Title is required for selected locale: uz'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
