  '/api/v1/business/organizations/{organization_id}/surveys/{survey_id}/logic':
    get:
      summary: 'Read Survey Logic'
      operationId: readSurveyLogic
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  rules: []
                properties:
                  rules:
                    type: array
                    example: []
      tags:
        - Business
    put:
      summary: 'Replace Survey Logic'
      operationId: replaceSurveyLogic
      description: 'Atomically replaces all rules. Send rules: [] to remove all logic. See API-SURVEY-LOGIC.md for the contract.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  rules:
                    -
                      id: 1
                      action: show_question
                      source_page_id: null
                      target_page_id: null
                      target_question_id: 202
                      priority: 0
                      match: all
                      conditions:
                        -
                          question_id: 101
                          operator: equals
                          value: 501
                properties:
                  rules:
                    type: array
                    example:
                      -
                        id: 1
                        action: show_question
                        source_page_id: null
                        target_page_id: null
                        target_question_id: 202
                        priority: 0
                        match: all
                        conditions:
                          -
                            question_id: 101
                            operator: equals
                            value: 501
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        action:
                          type: string
                          example: show_question
                        source_page_id:
                          type: string
                          example: null
                          nullable: true
                        target_page_id:
                          type: string
                          example: null
                          nullable: true
                        target_question_id:
                          type: integer
                          example: 202
                        priority:
                          type: integer
                          example: 0
                        match:
                          type: string
                          example: all
                        conditions:
                          type: array
                          example:
                            -
                              question_id: 101
                              operator: equals
                              value: 501
                          items:
                            type: object
                            properties:
                              question_id:
                                type: integer
                                example: 101
                              operator:
                                type: string
                                example: equals
                              value:
                                type: integer
                                example: 501
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVALID_SURVEY_LOGIC
                    message: 'Invalid survey logic.'
                    fields:
                      rules.0:
                        - 'Navigation may only target a later page in this survey.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_SURVEY_LOGIC
                      message:
                        type: string
                        example: 'Invalid survey logic.'
                      fields:
                        type: object
                        properties:
                          rules.0:
                            type: array
                            example:
                              - 'Navigation may only target a later page in this survey.'
                            items:
                              type: string
      tags:
        - Business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  description: 'One conditional rule. Maximum 100 rules per survey.'
                  example:
                    -
                      action: show_question
                      target_question_id: 202
                      priority: 0
                      match: all
                      conditions:
                        -
                          question_id: 101
                          operator: equals
                          value: 501
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                        description: 'show_question, skip_to_page, or complete.'
                        example: show_question
                        enum:
                          - show_question
                          - skip_to_page
                          - complete
                      source_page_id:
                        type: integer
                        description: 'Required only for navigation rules. Must be at least 1.'
                        example: null
                        nullable: true
                      target_page_id:
                        type: integer
                        description: 'Required only for skip_to_page; must be a later page. Must be at least 1.'
                        example: null
                        nullable: true
                      target_question_id:
                        type: integer
                        description: 'Required only for show_question. Must be at least 1.'
                        example: 202
                        nullable: true
                      priority:
                        type: integer
                        description: 'Smaller values win; ties use input order. Must be at least 0. Must not be greater than 1000000.'
                        example: 0
                      match:
                        type: string
                        description: 'all for AND, any for OR.'
                        example: all
                        enum:
                          - all
                          - any
                      conditions:
                        type: array
                        description: 'One condition. Maximum 20 per group.'
                        example:
                          -
                            question_id: 101
                            operator: equals
                            value: 501
                        items:
                          type: object
                          properties:
                            question_id:
                              type: integer
                              description: 'Earlier-page question for visibility, earlier/current-page question for navigation. Must be at least 1.'
                              example: 101
                            operator:
                              type: string
                              description: 'Question-type-specific operator; see API-SURVEY-LOGIC.md.'
                              example: equals
                              enum:
                                - equals
                                - not_equals
                                - contains
                                - not_contains
                                - greater_than
                                - less_than
                                - answered
                                - not_answered
                            value:
                              description: 'Integer option ID, integer rating, or text. Omit for answered/not_answered.'
                              example: 501
                              oneOf:
                                -
                                  type: integer
                                -
                                  type: string
                                  nullable: true
                          required:
                            - question_id
                            - operator
                        minItems: 1
                        maxItems: 20
                    required:
                      - action
                      - priority
                      - match
                      - conditions
                  maxItems: 100
              required:
                - rules
    parameters:
      -
        in: path
        name: organization_id
        description: 'The ID of the organization.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: survey_id
        description: 'The ID of the survey.'
        example: 1
        required: true
        schema:
          type: integer
